name: Build NuvolaVPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Download hev-socks5-tunnel AAR
        run: |
          mkdir -p app/libs
          curl -L --fail --connect-timeout 30 --max-time 300 \
            -o app/libs/hev-socks5-tunnel.aar \
            https://github.com/heiher/hev-socks5-tunnel/releases/download/2.14.4/hev-socks5-tunnel.aar
          ls -la app/libs/
          test -f app/libs/hev-socks5-tunnel.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvolavpn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
