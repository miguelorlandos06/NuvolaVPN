name: Build NuvolaVPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264'

      - name: Export NDK env
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Build libhev-socks5-tunnel.so
        run: |
          mkdir -p app/src/main/jni
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel app/src/main/jni/hev-socks5-tunnel
          echo 'include $(call all-subdir-makefiles)' > app/src/main/jni/Android.mk
          "$NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=app/src/main/jni \
            APP_BUILD_SCRIPT=app/src/main/jni/Android.mk \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-26 \
            "APP_CFLAGS=-O3 -DPKGNAME=com/nuvola/vpn/engine" \
            NDK_LIBS_OUT=app/src/main/jniLibs \
            NDK_OUT=app/build/ndk-obj
          rm -f app/src/main/jniLibs/arm64-v8a/hev-socks5-tunnel-bin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename Release APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/NuvolaVPN-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvolaVPN-release-apk
          path: app/build/outputs/apk/release/NuvolaVPN-release.apk
          retention-days: 14
